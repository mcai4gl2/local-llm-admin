name: public-guard

# Keeps deployment facts and secrets out of this public repository:
# gitleaks for credentials, and a private denylist (repo secret PUBLIC_DENYLIST, one regex
# per line) for identifiers. Neither job ever prints matched text.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.24.3

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  denylist:
    name: private denylist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for the denylist secret
        id: secret
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
        run: |
          if [ -z "$PUBLIC_DENYLIST" ]; then
            echo "::notice::PUBLIC_DENYLIST is not available (fork pull request); the next push to main runs this check."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secret.outputs.available == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.secret.outputs.available == 'true'
        with:
          python-version: '3.11'
      - name: Scan tracked files, commit messages and history
        if: steps.secret.outputs.available == 'true'
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
          PUBLIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        # Scan the checked-out merged tree, plus both real branch histories.
        # GitHub's temporary PR merge identity is not a submitted commit identity.
        run: |
          python3 scripts/check_public.py --patterns-env PUBLIC_DENYLIST --git . --commits "$PUBLIC_HEAD_SHA"
          if [ "$PUBLIC_BASE_SHA" != "$PUBLIC_HEAD_SHA" ]; then
            python3 scripts/check_public.py --patterns-env PUBLIC_DENYLIST --git . --commits "$PUBLIC_BASE_SHA"
          fi
